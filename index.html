<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sky Dash</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sky Dash">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0c0f14;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    #ui {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; color: #e8f0ff; font-weight: 600; letter-spacing: .3px;
    }
    #buttons { display:flex; gap:10px; }
    button {
      background: #1a2030; color: #e8f0ff; border: 1px solid #2a344a;
      padding: 8px 12px; border-radius: 10px; font-weight: 600;
    }
    button:active { transform: translateY(1px); }
    #hint {
      position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
      color: #a8b3c7; font-size: 14px;
    }
    canvas { display:block; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <div id="ui">
    <div>Score: <span id="score">0</span> | Record: <span id="best">0</span></div>
    <div id="buttons">
      <button id="pauseBtn" aria-label="Pause">⏸️</button>
      <button id="muteBtn" aria-label="Mute">🔊</button>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div id="hint">Touchez l'écran pour sauter. Espace = saut. Deux sauts = double saut.</div>
  <script src="main.js"></script>
</body>
</html>
